<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博朋克飞机大战</title>
    <link rel="stylesheet" href="cyberpunk_plane.css">
</head>
<body>
    <div class="game-container">
        <div class="background-grid"></div>
        <div class="scanline"></div>
        
        <!-- 游戏UI -->
        <div class="game-ui">
            <div class="hud-panel left-panel">
                <div class="hud-item">
                    <div class="hud-icon">⚡</div>
                    <div class="hud-content">
                        <div class="hud-label">SCORE</div>
                        <div class="hud-value" id="score">0</div>
                    </div>
                </div>
                <div class="hud-item">
                    <div class="hud-icon">❤️</div>
                    <div class="hud-content">
                        <div class="hud-label">LIVES</div>
                        <div class="hud-value" id="lives">3</div>
                    </div>
                </div>
                <div class="hud-item">
                    <div class="hud-icon">🎯</div>
                    <div class="hud-content">
                        <div class="hud-label">LEVEL</div>
                        <div class="hud-value" id="level">1</div>
                    </div>
                </div>
            </div>
            
            <div class="hud-panel right-panel">
                <div class="power-display">
                    <div class="power-header">
                        <span class="power-icon">🔋</span>
                        <span class="power-label">POWER CORE</span>
                    </div>
                    <div class="power-bar-container">
                        <div class="power-bar-outer">
                            <div class="power-bar-inner" id="powerFill"></div>
                            <div class="power-bar-shine"></div>
                        </div>
                        <div class="power-percentage" id="powerPercentage">100%</div>
                    </div>
                </div>
                <div class="combo-display">
                    <div class="combo-text">COMBO</div>
                    <div class="combo-value" id="comboValue">x1</div>
                </div>
            </div>
        </div>
        
        <!-- 增强的HUD元素 -->
        <div class="hud-overlays">
            <div class="minimap">
                <div class="minimap-title">RADAR</div>
                <canvas id="minimapCanvas" width="120" height="90"></canvas>
            </div>
            
            <div class="threat-indicator">
                <div class="threat-title">THREAT LEVEL</div>
                <div class="threat-bar">
                    <div class="threat-fill" id="threatFill"></div>
                </div>
            </div>
        </div>

        <!-- 游戏画布 -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- 开始界面 -->
        <div class="start-screen" id="startScreen">
            <div class="title">
                <h1>赛博朋克大战</h1>
                <div class="subtitle">CYBERPUNK WARFARE</div>
            </div>
            <div class="start-menu">
                <button class="cyber-button success" id="startButton">开始游戏</button>
                <button class="cyber-button" id="settingsButton">游戏设置</button>
                <div class="game-controls">
                    <div class="control-item">
                        <span class="control-label">音效</span>
                        <label class="cyber-switch">
                            <input type="checkbox" id="soundToggle" checked>
                            <span class="switch-slider"></span>
                        </label>
                    </div>
                    <div class="control-item">
                        <span class="control-label">音乐</span>
                        <label class="cyber-switch">
                            <input type="checkbox" id="musicToggle" checked>
                            <span class="switch-slider"></span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="controls-info">
                <p>使用 WASD 或方向键移动</p>
                <p>空格键发射子弹</p>
            </div>
        </div>
        
        <!-- 游戏结束界面 -->
        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-title">
                <h2>游戏结束</h2>
                <div class="final-score">
                    <span>最终得分: </span>
                    <span id="finalScore">0</span>
                </div>
            </div>
            <div class="game-over-menu">
                <button class="cyber-button" id="restartButton">重新开始</button>
                <button class="cyber-button" id="menuButton">返回菜单</button>
            </div>
        </div>
        
        <!-- 粒子效果容器 -->
        <div class="particles-container" id="particlesContainer"></div>
    </div>
    
    <script src="cyberpunk_plane.js"></script>
</body>
</html>
